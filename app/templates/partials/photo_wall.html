{% macro photo_wall(cols, label='') %}
<div class="wall" role="img" aria-label="{{ label }}">
    <div class="wall-stage" aria-hidden="true">
        {% for col in cols %}
        <div class="wall-col">
            <div class="wall-track wall-{{ col['dir'] }}" style="--dur: {{ col['dur'] }}s">
                {% for _ in range(2) %}
                    {% for name, ratio in col['photos'] %}
                    <div class="wall-card" style="aspect-ratio: {{ ratio }}">
                        <img src="{{ url_for('static',filename='images/' ~ name) }}"
                             alt=""
                             loading="lazy"
                             decoding="async"
                             onerror="this.style.visibility='hidden'">
                    </div>
                    {% endfor %}
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endmacro %}
